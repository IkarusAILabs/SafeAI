name: Release
true:
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v2.0.1)
        required: true
permissions: read-all
jobs:
  checklist:
    name: Pre-release checklist
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Extract metadata
      id: meta
      run: 'TAG="${{ github.ref_name || inputs.tag }}"

        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        '
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: 'pip install --require-hashes -r requirements.txt

        pip install --no-deps -e .

        pip install --require-hashes -r requirements-test.txt

        '
    - name: 'Check: canonical release checklist'
      run: python scripts/check_release.py
    - name: 'Check: version string matches tag'
      run: "TAG_VERSION=\"${{ steps.meta.outputs.version }}\"\nCODE_VERSION=$(python\
        \ -c \"from safeai.version import SAFEAI_VERSION; print(SAFEAI_VERSION)\"\
        )\nif [ \"$TAG_VERSION\" = \"2\" ]; then\n  echo \"Floating tag v2 \u2014\
        \ skipping version-match check\"\nelif [ \"$TAG_VERSION\" != \"$CODE_VERSION\"\
        \ ]; then\n  echo \"::error::Tag version ($TAG_VERSION) != code version ($CODE_VERSION)\"\
        \n  exit 1\nelse\n  echo \"Version match: $TAG_VERSION\"\nfi\n"
    - name: 'Check: all rules have required fields'
      run: "python -c \"\nimport yaml, sys\nwith open('safeai/rules/base_rules.yaml')\
        \ as f:\n    rules = yaml.safe_load(f)\nrequired = {'id', 'severity', 'description'}\n\
        bad = [r for r in rules if not required.issubset(r.keys())]\nif bad:\n   \
        \ for r in bad:\n        print(f'Missing fields in rule: {r.get(\\\"id\\\"\
        , \\\"UNKNOWN\\\")}')\n    sys.exit(1)\nprint(f'All {len(rules)} rules have\
        \ required fields')\n\"\n"
    - name: 'Check: compatibility tests pass'
      run: python -m pytest tests/test_compatibility.py -q --tb=short
    - name: 'Check: benchmarks pass (full corpus, release-blocking)'
      run: python scripts/run_benchmarks.py --subset full
    - name: 'Check: fixture coverage completeness'
      run: "python -c \"\nimport os\nFIXTURES = 'tests/fixtures'\nfrom safeai.frameworks\
        \ import discover_parsers\nparsers = discover_parsers()\nframeworks = set()\n\
        for parser in parsers:\n    for test_file, test_content in [('test.py', ''),\
        \ ('test.json', '{}'), ('test.yaml', '')]:\n        result = parser.parse(test_file,\
        \ test_content)\n        if isinstance(result, dict) and 'framework' in result:\n\
        \            frameworks.add(result['framework'])\n            break\n# Map\
        \ framework names to fixture directory names\nFRAMEWORK_TO_FIXTURE = {'microsoft_agent_framework':\
        \ 'microsoft_agent'}\nwith_fixtures = set()\nfor entry in os.scandir(FIXTURES):\n\
        \    if entry.is_dir() and entry.name not in ('mcp', 'action', 'regression',\
        \ 'claude_code'):\n        rep = os.path.join(entry.path, 'representative')\n\
        \        if os.path.isdir(rep):\n            # Check if this directory name\
        \ maps to a framework name\n            mapped = False\n            for fw_name,\
        \ fw_dir in FRAMEWORK_TO_FIXTURE.items():\n                if entry.name ==\
        \ fw_dir:\n                    with_fixtures.add(fw_name)\n              \
        \      mapped = True\n                    break\n            if not mapped:\n\
        \                with_fixtures.add(entry.name)\nif os.path.isdir(os.path.join(FIXTURES,\
        \ 'claude_code', 'compatibility')):\n    with_fixtures.add('claude_code')\n\
        missing = frameworks - with_fixtures\nif missing:\n    print(f'Frameworks\
        \ missing golden fixtures: {sorted(missing)}')\n    exit(1)\nprint(f'All {len(frameworks)}\
        \ frameworks have golden fixtures')\n\"\n"
    - name: 'Check: support-matrix consistency'
      run: "python -c \"\nimport re, yaml\n# Read SUPPORT_MATRIX.md\nwith open('docs/reference/SUPPORT_MATRIX.md')\
        \ as f:\n    content = f.read()\n# Extract adapter names from the Framework\
        \ Adapters table only\n# Find the table between \"## Framework Adapters\"\
        \ and the next \"##\"\nframework_section = re.search(r'## Framework Adapters\\\
        n(.*?)(?=\\n## |\\Z)', content, re.DOTALL)\nif framework_section:\n    adapter_pattern\
        \ = r'\\| \\x60([a-z0-9_]+)\\x60 \\|'\n    matrix_adapters = set(re.findall(adapter_pattern,\
        \ framework_section.group(1)))\nelse:\n    matrix_adapters = set()\n# Extract\
        \ adapter names from registered parsers\nfrom safeai.frameworks import discover_parsers\n\
        parsers = discover_parsers()\ncode_adapters = set()\nfor parser in parsers:\n\
        \    result = parser.parse('test.py', '')\n    if isinstance(result, dict)\
        \ and 'framework' in result:\n        code_adapters.add(result['framework'])\n\
        \    elif hasattr(parser, 'name'):\n        code_adapters.add(parser.name)\n\
        # Compare\nmissing_in_matrix = code_adapters - matrix_adapters\nmissing_in_code\
        \ = matrix_adapters - code_adapters\nif missing_in_matrix:\n    print(f'Adapters\
        \ in code but not in SUPPORT_MATRIX.md: {sorted(missing_in_matrix)}')\n  \
        \  exit(1)\nif missing_in_code:\n    print(f'Adapters in SUPPORT_MATRIX.md\
        \ but not in code: {sorted(missing_in_code)}')\n    exit(1)\nprint(f'SUPPORT_MATRIX.md\
        \ is consistent with {len(code_adapters)} adapters')\n# Check Action inputs\n\
        with open('action.yml') as f:\n    action = yaml.safe_load(f)\naction_inputs\
        \ = set(action['inputs'].keys())\n# Extract input names from SUPPORT_MATRIX.md\n\
        input_pattern = r'\\| \\x60([a-z-]+)\\x60 \\|'\nmatrix_inputs = set(re.findall(input_pattern,\
        \ content))\nmissing_inputs = action_inputs - matrix_inputs\nif missing_inputs:\n\
        \    print(f'Action inputs in code but not in SUPPORT_MATRIX.md: {sorted(missing_inputs)}')\n\
        \    exit(1)\nprint(f'SUPPORT_MATRIX.md Action inputs are consistent')\n\"\
        \n"
    - name: 'Check: SARIF output is valid'
      run: 'python -c "

        from safeai.engine.scan import run_scan

        from safeai.report.sarif import write_sarif

        import json, tempfile, os

        report = run_scan(''tests/fixtures/crewai/representative'')

        path = os.path.join(tempfile.mkdtemp(), ''test.sarif'')

        write_sarif(report, path)

        data = json.loads(open(path).read())

        assert data[''version''] == ''2.1.0'', ''Invalid SARIF version''

        assert len(data[''runs'']) >= 1, ''No SARIF runs''

        print(''SARIF output valid'')

        "

        '
    - name: 'Check: JSON report has required keys'
      run: "python -c \"\nfrom safeai.engine.scan import run_scan\nreport = run_scan('tests/fixtures/crewai/representative')\n\
        required = ['findings', 'counts', 'detected_frameworks', 'tool_surface', 'assurance_boundary']\n\
        missing = [k for k in required if k not in report]\nif missing:\n    print(f'Missing\
        \ keys: {missing}')\n    exit(1)\nprint(f'JSON report has all {len(required)}\
        \ required keys')\n\"\n"
    - name: 'Check: Action I/O contract stable'
      run: "python -c \"\nimport yaml\nwith open('action.yml') as f:\n    action =\
        \ yaml.safe_load(f)\ninputs = set(action['inputs'].keys())\noutputs = set(action['outputs'].keys())\n\
        expected_inputs = {'path','version','fail-on','sarif','rules','baseline','fail-on-new','fail-on-escalation','no-registry','extra-args','scorecard','scorecard-json','scorecard-summary','scorecard-fail-under','pr-comment-post'}\n\
        expected_outputs = {'sarif-path','scorecard-path','safeai-version'}\nmissing_i\
        \ = expected_inputs - inputs\nmissing_o = expected_outputs - outputs\nif missing_i:\n\
        \    print(f'Missing Action inputs: {missing_i}')\n    exit(1)\nif missing_o:\n\
        \    print(f'Missing Action outputs: {missing_o}')\n    exit(1)\nprint(f'Action\
        \ I/O contract stable: {len(inputs)} inputs, {len(outputs)} outputs')\n\"\n"
    - name: 'Check: failure_class_matrix present'
      run: 'python -c "

        from safeai.engine.scan import run_scan

        from safeai.report.failure_matrix import build_failure_class_matrix

        report = run_scan(''tests/fixtures/crewai/representative'')

        matrix = build_failure_class_matrix(report.get(''findings'', []))

        assert len(matrix) > 0, ''Empty failure class matrix''

        print(f''Failure class matrix: {len(matrix)} classes'')

        "

        '
    - name: 'Check: CHANGELOG has entry for this version'
      run: "VERSION=\"${{ steps.meta.outputs.version }}\"\nif ! grep -q \"\\[$VERSION\\\
        ]\" CHANGELOG.md; then\n  echo \"::error::CHANGELOG.md has no entry for v$VERSION\"\
        \n  exit 1\nfi\necho \"CHANGELOG entry found for v$VERSION\"\n"
  build:
    name: Build package
    needs: checklist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.checklist.outputs.sha }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Install build tools
      run: pip install --require-hashes -r requirements-build.txt
    - name: Build package
      run: python -m build
    - name: Verify package metadata
      run: 'python -m twine check dist/*

        echo "Package metadata valid"

        '
    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: dist
        path: dist/
        retention-days: 5
  attest:
    name: Generate artifacts
    needs:
    - checklist
    - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.checklist.outputs.sha }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: 'pip install --require-hashes -r requirements.txt

        pip install --no-deps -e .

        '
    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: dist
        path: dist/
    - name: Generate SBOM
      run: python scripts/generate_release_artifacts.py ${{ needs.checklist.outputs.version
        }}
    - name: Generate SLSA provenance
      run: "TAG=\"${{ needs.checklist.outputs.version }}\"\nSHA=\"${{ needs.checklist.outputs.sha\
        \ }}\"\ncat > \"dist/safeai-${TAG}-slsa-provenance.json\" << PROV\n{\n  \"\
        _type\": \"https://in-toto.io/Statement/v1\",\n  \"subject\": [{\"name\":\
        \ \"safeai-${TAG}.tar.gz\", \"digest\": {\"sha1\": \"${SHA}\"}}],\n  \"predicateType\"\
        : \"https://slsa.dev/provenance/v1\",\n  \"predicate\": {\n    \"buildType\"\
        : \"https://github.com/ikaruscareer/SafeAI/.github/workflows/release.yml\"\
        ,\n    \"externalParameters\": {\n      \"source\": {\"uri\": \"git+https://github.com/ikaruscareer/SafeAI@${SHA}\"\
        , \"digest\": {\"sha1\": \"${SHA}\"}}\n    },\n    \"metadata\": {\n     \
        \ \"buildInvocationId\": \"${{ github.run_id }}\",\n      \"completeness\"\
        : {\"parameters\": true, \"environment\": false, \"materials\": false}\n \
        \   }\n  }\n}\nPROV\n"
    - name: Generate SHA-256 checksums
      run: 'VER="${{ needs.checklist.outputs.version }}"

        cd dist

        sha256sum -- * > SHA256SUMS

        # Link the SBOM into the same checksum file (basename only, so the

        # release invariant gate can match every staged file by name).

        sha256sum -- "../release-artifacts/safeai-${VER}-sbom.spdx.json" | sed "s|../release-artifacts/||"
        >> SHA256SUMS

        echo "Checksums generated:"

        cat SHA256SUMS

        '
    - name: Upload attestations
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: attestations
        path: 'release-artifacts/safeai-${{ needs.checklist.outputs.version }}-sbom.spdx.json

          dist/SHA256SUMS

          dist/safeai-${{ needs.checklist.outputs.version }}-slsa-provenance.json

          '
        retention-days: 5
  sign:
    name: Sigstore-sign artifacts
    needs:
    - checklist
    - attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.checklist.outputs.sha }}
    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: dist
        path: dist/
    - name: Download attestations
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: attestations
        path: attestations/
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Attest build provenance (Sigstore)
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: 'dist/*.whl

          dist/*.tar.gz

          '
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v2.6.1
    - name: Sign artifacts with Cosign (keyless)
      run: "for f in dist/*.whl dist/*.tar.gz; do\n  cosign sign-blob --yes --output-signature\
        \ \"${f}.sig\" --output-certificate \"${f}.pem\" \"$f\"\ndone\necho \"Cosign\
        \ signatures:\"\nls -la dist/*.sig dist/*.pem\n"
    - name: Verify signatures with Cosign (fail closed)
      run: "for f in dist/*.whl dist/*.tar.gz; do\n  cosign verify-blob --signature\
        \ \"${f}.sig\" --certificate \"${f}.pem\" \\\n    --certificate-identity-regexp\
        \ \"https://github.com/${{ github.repository }}/.*\" \\\n    --certificate-oidc-issuer\
        \ \"https://token.actions.githubusercontent.com\" \\\n    \"$f\"\n  echo \"\
        Verified: $f\"\ndone\n"
    - name: Prepare release assets
      run: 'VER="${{ needs.checklist.outputs.version }}"

        mkdir -p signed

        cp dist/*.whl dist/*.tar.gz signed/

        cp dist/*.sig dist/*.pem signed/

        cp attestations/dist/SHA256SUMS signed/

        cp "attestations/dist/safeai-${VER}-slsa-provenance.json" signed/

        cp "attestations/release-artifacts/safeai-${VER}-sbom.spdx.json" signed/

        echo "Release assets:"

        ls -la signed/

        '
    - name: Verify release asset invariants
      run: "python scripts/verify_release_assets.py signed/ \\\n  \"${{ needs.checklist.outputs.version\
        \ }}\"\n"
    - name: Upload signed artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: signed
        path: signed/
        retention-days: 5
  publish:
    name: Publish to PyPI
    needs:
    - checklist
    - sign
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Download signed artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: signed
        path: signed/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      with:
        packages-dir: signed/
  release:
    name: Upload to GitHub Release
    needs:
    - checklist
    - sign
    - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download signed artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: signed
        path: signed/
    - name: Upload to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.checklist.outputs.version }}
        GH_REPO: ${{ github.repository }}
      run: "TAG=\"v${TAG}\"\n# Create release if it doesn't exist\ngh release view\
        \ \"$TAG\" >/dev/null 2>&1 || gh release create \"$TAG\" --generate-notes\n\
        # Upload signed artifacts only: signed/ passed the asset\n# invariant gate,\
        \ so every file belongs to this tag.\nfor f in signed/*; do\n  [ -f \"$f\"\
        \ ] || continue\n  gh release upload \"$TAG\" \"$f\" --clobber\ndone\necho\
        \ \"All artifacts uploaded to release $TAG\"\n"
