name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default GITHUB_TOKEN cannot read classic branch protection rules.
      # To fix the Branch-Protection check, create a fine-grained PAT with
      # "Repository administration" (read) permission and store it as
      # SCORECARD_GITHUB_TOKEN. See:
      # https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
        env:
          SCORECARD_GITHUB_TOKEN: ${{ secrets.SCORECARD_GITHUB_TOKEN }}

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@48870fdd6b42ee6474ec4207209ff87609271a5e # v4.39.0
        with:
          sarif_file: results.sarif
