name: Verify latest release

# Runs the steps in docs/reference/VERIFICATION.md against the latest
# published release, so the documented verification is known to work
# (credibility track G-3). Read-only: it downloads release assets and
# checks them; it builds, signs and publishes nothing.

on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "scripts/verify_release.sh"
      - "docs/reference/VERIFICATION.md"
      - ".github/workflows/verify-release.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify_release.sh"
      - "docs/reference/VERIFICATION.md"
      - ".github/workflows/verify-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release to verify (e.g. 2.16.0). Empty: the latest release."
        required: false

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify the latest release as documented
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # Same pin as release.yml, for the reason given there.
          cosign-release: v2.6.1

      - name: Verify the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/verify_release.sh "$VERSION"
