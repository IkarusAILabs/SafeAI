version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init, autobuild, analyze and upload-sarif must run the same
      # version; separate bumps fail the CodeQL job.
      codeql-action:
        patterns:
          - "github/codeql-action*"
