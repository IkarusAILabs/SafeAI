apiVersion: spire.spiffe.io/v1alpha1
kind: ControllerManagerConfig
trustDomain: corp.example
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: agents
spec:
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  podSelector:
    matchLabels:
      role: agent
  federatesWith:
    - partner.example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner
  namespace: agents
spec:
  template:
    metadata:
      labels:
        role: agent
    spec:
      serviceAccountName: planner-sa
      containers:
        - name: planner
          image: planner:1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: finance
spec:
  template:
    metadata:
      labels:
        app: payments
    spec:
      serviceAccountName: payments-sa
      containers:
        - name: payments
          image: payments:1
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: payments-callers
  namespace: finance
spec:
  selector:
    matchLabels:
      app: payments
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.example/ns/agents/sa/planner-sa
