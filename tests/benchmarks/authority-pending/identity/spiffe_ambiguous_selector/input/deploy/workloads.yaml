apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage
  namespace: support
spec:
  template:
    metadata:
      labels:
        role: agent
    spec:
      serviceAccountName: triage-sa
      containers:
        - name: triage
          image: triage:1
