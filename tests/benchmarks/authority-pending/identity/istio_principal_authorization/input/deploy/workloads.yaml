apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: agents
spec:
  template:
    metadata:
      labels:
        role: agent
    spec:
      serviceAccountName: orchestrator-sa
      containers:
        - name: orchestrator
          image: orchestrator:1
---
apiVersion: apps/v1
kind: Deployment
