apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa
  namespace: prod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa
  namespace: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: dev
spec:
  template:
    spec:
      serviceAccountName: agent-sa
      containers:
        - name: agent
          image: agent:1.0
