apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-agent-full
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-agent-binding
subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-agent-full
  apiGroup: rbac.authorization.k8s.io
