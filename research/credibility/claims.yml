# C-8 claims ledger (docs/research/CREDIBILITY_TRACK.md).
#
# Every public claim SafeAI makes, with what backs it. `python
# scripts/claims_check.py` checks this file: each repository claim's
# `quote` must still appear in its `source`, every `count` claim is
# recomputed from the code, and every `test` backing must exist. A claim
# whose source wording changes, or whose number drifts from the code,
# fails CI until the ledger and the wording agree.
#
# Fields: id; source (repository path, or https URL for claims outside
# the repository, with `retrieved`); quote (verbatim, short); kind
# (count | property | quality | positioning | limitation); status:
#   counted       a number recomputed from the code by `count`
#   tested        a property a named test checks (`backing.tests`)
#   unmeasured    a quality claim no measurement backs yet (`study` names the one that will)
#   overclaim     no planned measurement can back it; reword or remove
#   stale         factually out of date
#   positioning   a comparison or framing; needs C-4 to back it
#   limitation    states what SafeAI does not do (kept so it is not dropped)
# action: what should change, when something should.
#
# Rule 6: wording is strengthened only after a published measurement.
# Corrections of wrong numbers and withdrawals of overclaims are not
# strengthening and can happen at any time.

version: 1
inventoried: '2026-11-08'
claims:

