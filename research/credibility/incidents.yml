# has verified or rejected.
#
# An entry is `candidate` until two people have read the advisory and
# the fix diff, without seeing what SafeAI reports, and agreed on
# static_visibility (visible | runtime-only), expected.rules and
# expected.paths (scripts/incident_verify.py). Only `verified` entries
# are scored; `rejected` entries stay listed with a reason in notes.
