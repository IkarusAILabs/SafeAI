id: s1_delegated_access
title: Delegated access
question: >-
  Can the potential authority path from the initiating agent to a delegate
  and its tools be reconstructed?
annotation:
  # Drafted with AI assistance from the fixture. Not ground truth until a
  # person from each project has reviewed it and is named below.
  basis: ai_assisted_draft
  status: pending_human_review
  reviewers: []

intent:
  agents: [triage, billing]
  authority:
    - {agent: billing, tool: issue_refund, action: write, via: []}
    - {agent: triage, tool: issue_refund, action: write, via: [billing]}
  delegations:
    - {from: triage, to: billing, scope: broader_or_different}
  identity:
    - {agent: triage, principal: null, note: No identity is declared in the fixture.}
    - {agent: billing, principal: null, note: No identity is declared in the fixture.}

# Proposal for the runtime side. Nothing below has been run.
runtime:
  policy:
    - {agent: billing, tool: issue_refund, decision: PERMIT}
    - {agent: triage, tool: issue_refund, decision: PERMIT,
       note: Only when acting through a handoff to billing.}
  requests:
    - {agent: billing, tool: issue_refund, expect_decision: PERMIT}
    - {agent: triage, tool: issue_refund, expect_decision: PERMIT}

expected_outcomes:
  - {agent: billing, tool: issue_refund, outcome: agreement, reason: potential_exercised}
  - {agent: triage, tool: issue_refund, outcome: agreement, reason: potential_exercised}
